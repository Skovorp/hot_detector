run_name: 30k_100ep_one_scheduler
seed: 42
device: "cuda"

data:
  cache_dir: "/root/hot_detector/pairwise/image_cache"
  num_items_epoch: 30000

model:
  use_layers: 1

training:
  epochs: 100
  part_warmup: 0.1
  train_bs: 64
  val_bs: 64
  num_workers: 20
  lr_embed: 1.0e-3
  lr_combiner: 1.0e-3
  weight_decay: 0.1
  grad_clip: 1.0
  output_dir: "/root/hot_detector/pairwise/checkpoints"
  prefetch_factor: 1