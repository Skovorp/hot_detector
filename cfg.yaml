run_name: mse_800m
model:
  backbone: "facebook/dinov3-vith16plus-pretrain-lvd1689m"
  bb_dim: 1280
data:
  resize_to: 512
  root_dir: "/root/exp_photos"
training:
  epochs: 3
  part_warmup: 0.2
  train_bs: 2
  val_bs: 2
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 0.01
  grad_clip: 10.0
seed: 42
device: "cuda"